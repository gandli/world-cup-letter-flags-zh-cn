<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ede6d8" />
    <meta
      name="description"
      content="用 2026 世界杯四强 26 人大名单的字母悬挂而成的字符帘幕互动装置。"
    />
    <title>四强字母旗 · Final Four Typographic Flags</title>
  </head>
  <body>
    <div class="grain" aria-hidden="true"></div>

    <header class="site-header">
      <a class="wordmark" href="#top" aria-label="返回首页">
        <span>四强 · Final Four</span>
        <small>北美 · 2026</small>
      </a>

      <nav class="team-nav" aria-label="选择国家队"></nav>

      <div class="header-actions">
        <div class="mode-switch" role="group" aria-label="选择背景模式">
          <button type="button" data-scene-mode="architecture" aria-pressed="true">建筑</button>
          <button type="button" data-scene-mode="plaster" aria-pressed="false">灰墙</button>
        </div>
        <button class="roster-toggle" type="button" aria-controls="roster-panel" aria-expanded="false">
          名单 <span aria-hidden="true">↗</span>
        </button>
      </div>
    </header>

    <main id="top" class="experience">
      <section class="editorial" aria-live="polite">
        <p class="eyebrow">2026 世界杯 · 四强研究</p>
        <h1 class="country-title">España</h1>
        <p class="country-poem">红土 · 金光 —— 一面由二十六个名字系起来的旗。</p>
        <dl class="country-facts">
          <div><dt>代码</dt><dd class="country-code">ESP</dd></div>
          <div><dt>球员</dt><dd>26</dd></div>
          <div><dt>编号</dt><dd class="country-index">01 / 04</dd></div>
        </dl>
      </section>

      <section class="flag-shell" aria-label="字母旗互动装置">
        <div class="country-sky" aria-hidden="true"></div>
        <div class="country-wall" aria-hidden="true"></div>
        <div class="canopy" aria-hidden="true"></div>
        <canvas id="flag-canvas"></canvas>
        <div class="interaction-hint" aria-hidden="true">
          <span class="hint-dot"></span>
          滑过悬挂的名字
        </div>
        <div class="audio-caption" aria-live="polite" aria-atomic="true" hidden>
          <span>现场解说</span>
          <p></p>
          <a class="audio-source" target="_blank" rel="noreferrer">官方集锦 ↗</a>
        </div>
      </section>

      <div class="weather-front" aria-hidden="true"></div>

      <div class="scene-controls" aria-label="国家队切换控制">
        <button class="arrow-button previous" type="button" aria-label="上一队">←</button>
        <p><span class="current-number">01</span><i></i><span>04</span></p>
        <button class="arrow-button next" type="button" aria-label="下一队">→</button>
      </div>

      <p class="build-note">每一个字母, 都属于名单里的一位球员。</p>
    </main>

    <aside id="roster-panel" class="roster-panel" aria-hidden="true" aria-label="国家队名单">
      <div class="roster-panel__head">
        <div>
          <p class="eyebrow">完整 26 人</p>
          <h2 class="roster-title">西班牙名单</h2>
        </div>
        <button class="roster-close" type="button" aria-label="关闭名单面板">×</button>
      </div>
      <div class="roster-groups"></div>
      <p class="roster-source"></p>
    </aside>
    <button class="panel-scrim" type="button" aria-label="关闭名单面板" tabindex="-1"></button>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
